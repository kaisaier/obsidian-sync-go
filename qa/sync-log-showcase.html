<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sync Go Log Showcase</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root { --background-primary:#fff;--background-secondary:#f3f3f3;--background-secondary-alt:#fafafa;--background-modifier-border:#ddd;--background-modifier-border-faint:#e8e8e8;--background-modifier-hover:#e9e9e9;--text-normal:#222;--text-muted:#6b6b6b;--text-faint:#999;--text-success:#08a045;--text-error:#d83b3b;--text-warning:#d98200;--text-accent:#4b63c7;--text-accent-hover:#344ba9;--text-on-accent:#fff;--interactive-accent:#5b6fd8;--interactive-accent-rgb:91,111,216;--font-ui-small:12px;font-family:system-ui,"Microsoft YaHei",sans-serif}
    body{margin:0;padding:24px;background:#e9edf2;color:var(--text-normal)}
    .showcase{display:flex;align-items:flex-start;justify-content:center;gap:24px;flex-wrap:wrap}
    .panel{width:360px;height:720px;border:1px solid #d7dce2;border-radius:8px;background:#fff;box-shadow:0 8px 24px #24304418;overflow:hidden}
    button{font:inherit}.clickable-icon{border:0;background:transparent;border-radius:4px}.clickable-icon svg{width:16px;height:16px}
  </style>
</head>
<body>
  <main class="showcase">
    <section class="panel">
      <div class="sync-go-log-container">
        <header class="sync-go-log-header">
          <div class="sync-go-log-title-group"><h3>同步日志</h3><div class="sync-go-log-live-status is-active">◌<span>正在同步 12 / 38</span></div></div>
          <div class="sync-go-log-header-actions"><button class="sync-go-log-icon-btn clickable-icon">⚙</button><button class="sync-go-log-icon-btn clickable-icon">▽</button><button class="sync-go-log-icon-btn clickable-icon">⌫</button></div>
        </header>
        <div class="sync-go-log-list">
          <div class="sync-go-summary-card"><div class="sync-go-summary-header has-border"><div class="sync-go-summary-title">✓<span>同步完成</span></div><div class="sync-go-summary-meta"><span class="sync-go-summary-type-tag">manual</span><span>17:13:08</span></div></div><div class="sync-go-summary-rows"><div class="sync-go-summary-row"><div class="sync-go-summary-label"><span class="sync-go-summary-dot sync-go-dot-note"></span><span>笔记</span></div><div class="sync-go-summary-badges"><span class="summary-badge badge-upload">↑8</span><span class="summary-badge badge-download">↓3</span></div></div><div class="sync-go-summary-row"><div class="sync-go-summary-label"><span class="sync-go-summary-dot sync-go-dot-attachment"></span><span>附件</span></div><div class="sync-go-summary-badges"><span class="summary-badge badge-delete">✕2</span></div></div></div></div>
          <div class="sync-go-log-item sync-go-log-category-note sync-go-log-status-success sync-go-log-type-receive"><div class="sync-go-log-item-header"><span class="sync-go-log-time">17:13:08</span><span class="sync-go-log-action">笔记修改</span><span class="sync-go-log-type-tag">↓ 下载</span><div class="sync-go-log-header-right"><span class="sync-go-log-status-tag status-success">✓</span></div></div><div class="sync-go-log-path is-clickable"><span>协作编辑/王婷_简历_优化版.md</span><button class="sync-go-path-action">□</button><button class="sync-go-path-action">↗</button></div></div>
          <div class="sync-go-log-item sync-go-log-category-attachment sync-go-log-status-pending sync-go-log-type-send"><div class="sync-go-log-item-header"><span class="sync-go-log-time">17:13:06</span><span class="sync-go-log-action">附件新增</span><span class="sync-go-log-type-tag">↑ 上传</span><div class="sync-go-log-header-right"><span class="sync-go-log-status-tag status-pending">…</span></div></div><div class="sync-go-log-path is-clickable"><span>资料库/很长的中文附件文件名用于检查窄侧栏换行效果.png</span></div><div class="sync-go-log-message">正在执行同步</div></div>
          <div class="sync-go-log-item sync-go-log-category-config sync-go-log-status-error sync-go-log-type-send"><div class="sync-go-log-item-header"><span class="sync-go-log-time">17:12:59</span><span class="sync-go-log-action">配置修改</span><span class="sync-go-log-type-tag">↑ 上传</span><div class="sync-go-log-header-right"><span class="sync-go-log-status-tag status-error">✕</span></div></div><div class="sync-go-log-path is-clickable"><span>.obsidian/plugins/obsidian-sync-go/data.json</span></div><div class="sync-go-log-message">Sync failed (manual)</div></div>
        </div>
        <footer class="sync-go-log-pagination"><button class="pagination-btn clickable-icon" disabled>«</button><button class="pagination-btn clickable-icon" disabled>‹</button><div class="pagination-info"><span class="page-current">1</span><span class="page-separator">/</span><span class="page-total">59</span></div><button class="pagination-btn clickable-icon">›</button><button class="pagination-btn clickable-icon">»</button></footer>
      </div>
    </section>
    <section class="panel">
      <div class="sync-go-log-container">
        <header class="sync-go-log-header"><div class="sync-go-log-title-group"><h3>同步日志</h3><div class="sync-go-log-live-status">⌁<span>空闲</span></div></div><div class="sync-go-log-header-actions"><button class="sync-go-log-icon-btn clickable-icon">⚙</button><button class="sync-go-log-icon-btn clickable-icon is-active">▽</button><button class="sync-go-log-icon-btn clickable-icon">⌫</button></div></header>
        <div class="sync-go-log-filter-panel"><div class="filter-group"><div class="filter-label">文件类别</div><div class="filter-chips"><button class="filter-chip">全部</button><button class="filter-chip is-active"><span class="sync-go-dot sync-go-dot-note"></span>笔记</button><button class="filter-chip"><span class="sync-go-dot sync-go-dot-attachment"></span>附件</button><button class="filter-chip"><span class="sync-go-dot sync-go-dot-folder"></span>文件夹</button><button class="filter-chip"><span class="sync-go-dot sync-go-dot-config"></span>配置</button></div></div><div class="filter-group"><div class="filter-label">同步方向</div><div class="filter-chips"><button class="filter-chip is-active">全部</button><button class="filter-chip"><span class="sync-go-dot sync-go-dot-send"></span>上传</button><button class="filter-chip"><span class="sync-go-dot sync-go-dot-receive"></span>下载</button></div></div><div class="filter-group"><button class="filter-chip">只看失败</button></div><div class="filter-footer"><button class="filter-reset-btn">重置</button><button class="filter-close-btn">收起</button></div></div>
        <div class="sync-go-log-list"><div class="sync-go-log-item sync-go-log-category-note sync-go-log-status-success sync-go-log-type-send"><div class="sync-go-log-item-header"><span class="sync-go-log-time">16:48:22</span><span class="sync-go-log-action">笔记新增</span><span class="sync-go-log-type-tag">↑ 上传</span><div class="sync-go-log-header-right"><span class="sync-go-log-status-tag status-success">✓</span></div></div><div class="sync-go-log-path is-clickable"><span>项目/阶段性复盘与后续行动计划.md</span></div></div></div>
      </div>
    </section>
  </main>
</body>
</html>
